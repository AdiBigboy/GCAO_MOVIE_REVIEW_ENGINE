name: Build Indonesian TTS

on:
  workflow_dispatch:
  push:
    paths:
      - "remote_workers/indonesia_tts/**"
      - ".github/workflows/build-indonesia-tts.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adibigboy/gcao-indonesia-tts
  IMAGE_TAG: "0.1.0"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Indonesian image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: remote_workers/indonesia_tts
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Record immutable digest
        run: |
          {
            echo "## Indonesian TTS Image"
            echo "- Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Digest: ${{ steps.build.outputs.digest }}"
            echo "- Platform: linux/amd64"
            echo "- Model: Eempostor/F5-TTS-INDO-FINETUNE-V2"
            echo "- License: CC-BY-NC-4.0 (non-commercial evaluation only)"
          } >> "$GITHUB_STEP_SUMMARY"
